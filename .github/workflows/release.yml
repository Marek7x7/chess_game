# Builds the portable Linux and Windows executables, each for two CPU baselines: x86-64-v3 (AVX2 and BMI2, 2013 and
# later CPUs; about 24% faster than v2 on the same search, measured 2026-10-26) and x86-64-v2 for older ones and attaches them to a GitHub release when a tag
# v* is pushed (or on demand, as workflow artifacts). Written without being able to run GitHub Actions:
# tools/package.sh and the Windows cross-build were run locally, the rest (the runner packages, the
# Linux SDL2 bundling, the upload steps) is untested, and the Windows executable has not been run
# (no Wine here); fix whatever the first run shows.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  linux:
    strategy:
      matrix:
        arch: [x86-64-v3, x86-64-v2]
    runs-on: ubuntu-22.04  # the oldest glibc the runners offer, so the binary runs on most distributions
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies (SDL2 is built from source, these are its backends)
        run: >
          sudo apt-get update && sudo apt-get install -y cmake g++ python3 libx11-dev libxext-dev libxrandr-dev
          libxcursor-dev libxi-dev libxfixes-dev libxss-dev libwayland-dev libxkbcommon-dev libasound2-dev
          libpulse-dev libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCHESS_PORTABLE=ON -DCHESS_PORTABLE_ARCH=${{ matrix.arch }} && cmake --build build -j
      - name: Gates
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: tools/package.sh build/chess chess-linux-${{ matrix.arch }} tar.gz dist
      - uses: actions/upload-artifact@v4
        with:
          name: chess-linux-${{ matrix.arch }}
          path: dist/*

  windows:
    strategy:
      matrix:
        arch: [x86-64-v3, x86-64-v2]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cmake
        run: sudo apt-get update && sudo apt-get install -y cmake python3
      - name: Get llvm-mingw
        run: |
          mkdir -p "$RUNNER_TEMP/llvm-mingw" && cd "$RUNNER_TEMP/llvm-mingw"
          curl -sL -o llvm-mingw.tar.xz https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar xf llvm-mingw.tar.xz
          echo "$PWD/llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64/bin" >> "$GITHUB_PATH"
      - name: Build
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCHESS_PORTABLE=ON -DCHESS_PORTABLE_ARCH=${{ matrix.arch }}
          -DCMAKE_TOOLCHAIN_FILE=cmake/llvm-mingw.cmake && cmake --build build -j
      - name: Package
        run: tools/package.sh build/chess.exe chess-windows-${{ matrix.arch }} zip dist
      - uses: actions/upload-artifact@v4
        with:
          name: chess-windows-${{ matrix.arch }}
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
